# Builds and publishes the ARM64 Outline Server image to the GitHub Container Registry.
#
# The upstream project builds the Node.js app and the Go binaries on the host and
# only packages them into the Docker image, so the build runs natively on an ARM64
# runner without QEMU emulation.

name: Publish ARM64 Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push (linux/arm64)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install NPM Dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Set image metadata
        id: meta
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          # The image is pushed to GHCR, not Docker Hub, so Docker Content Trust
          # (which requires a Notary server) is not applicable.
          DOCKER_CONTENT_TRUST: '0'
        run: |
          ./task shadowbox:docker:build \
            TARGET_ARCH=aarch64 \
            IMAGE_NAME="${{ steps.meta.outputs.image }}" \
            IMAGE_VERSION="${{ steps.meta.outputs.date }}"

      - name: Push image
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.date }}"
          docker push "${{ steps.meta.outputs.image }}:latest"
